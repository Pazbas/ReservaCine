<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reservas Cine</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
   body {
    background-image: url("../fondo.jpg");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;


}


      .card {
            background-color: rgba(255, 255, 255, 0.90);
        }

        .seat {
            width: 45px;
            height: 45px;
            margin: 6px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            cursor: pointer;
        }

        .available { background-color: #28a745; color: white; }
        .reserved { background-color: #dc3545; color: white; }
    </style>
</head>

<body>

<div class="container py-4">
     <h1 class="text-center text-light mb-4">Reservas Cine</h1>

    <!-- Selección de sala -->
    <div class="card p-3 mb-4">
        <h4>Seleccionar Sala</h4>
        <select id="selectSala" class="form-select mt-2"></select>
    </div>

    <!-- Vista tipo cine -->
    <div class="card p-3 mb-4">
        <h4 class="mb-3">Vista de Asientos</h4>
        <div class="screen"> PANTALLA </div>
        <div id="contenedorAsientos" class="d-flex flex-wrap justify-content-center"></div>
    </div>

  
    <div class="card p-3">
        <h4>👥 Socios con reservas</h4>
        <ul id="listaSocios" class="list-group mt-3"></ul>
    </div>

</div>


<div class="modal fade" id="modalNombre" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Reservar asiento</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <label class="form-label">Nombre del socio</label>
                <input id="inputNombre" type="text" class="form-control" placeholder="Ej: Juan Pérez">
                <input id="asientoSeleccionado" type="hidden">
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button class="btn btn-primary" id="btnConfirmarReserva">Confirmar reserva</button>
            </div>
        </div>
    </div>
</div>

<script>

function crearSala(id, capacidad) {
    return {
        id: id,
        capacidad: capacidad,
        asientosDisponibles: Array.from({ length: capacidad }, (_, i) => i + 1),
        asientosReservados: {}, // asiento → nombre socio

        reservarAsiento(asiento, nombreSocio) {
            if (!this.asientosDisponibles.includes(asiento)) return false;
            this.asientosDisponibles = this.asientosDisponibles.filter(a => a !== asiento);
            this.asientosReservados[asiento] = nombreSocio;
            return true;
        },

        cancelarReserva(asiento) {
            if (!this.asientosReservados[asiento]) return false;
            delete this.asientosReservados[asiento];
            this.asientosDisponibles.push(asiento);
            return true;
        }
    };
}

const Cine = {
    nombre: "Cine Central",
    capacidadPorSala: 30,
    salas: [],

    crearSala(id) {
        const sala = crearSala(id, this.capacidadPorSala);
        this.salas.push(sala);
        return sala;
    }
};


Cine.crearSala(1);
Cine.crearSala(2);
Cine.crearSala(3);


const selectSala = document.getElementById("selectSala");
const contenedorAsientos = document.getElementById("contenedorAsientos");
const listaSocios = document.getElementById("listaSocios");


Cine.salas.forEach(s => {
    const opt = document.createElement("option");
    opt.value = s.id;
    opt.textContent = "Sala " + s.id;
    selectSala.appendChild(opt);
});


let modal = null;
document.addEventListener("DOMContentLoaded", () => {
    modal = new bootstrap.Modal(document.getElementById("modalNombre"));
});


function mostrarAsientos() {
    contenedorAsientos.innerHTML = "";

    const salaId = parseInt(selectSala.value);
    const sala = Cine.salas.find(s => s.id === salaId);

    for (let i = 1; i <= sala.capacidad; i++) {
        const d = document.createElement("div");
        d.classList.add("seat");

        if (sala.asientosDisponibles.includes(i)) {
            d.classList.add("available");
            d.onclick = () => seleccionarAsiento(i);
        } else {
            d.classList.add("reserved");
            d.title = `Reservado por: ${sala.asientosReservados[i]}`;
            d.onclick = () => {
                if (confirm(`¿Cancelar reserva del asiento ${i}?\nSocio: ${sala.asientosReservados[i]}`)) {
                    sala.cancelarReserva(i);
                    mostrarAsientos();
                    mostrarListaSocios();
                }
            };
        }

        d.textContent = i;
        contenedorAsientos.appendChild(d);
    }
}


function seleccionarAsiento(asiento) {
    document.getElementById("inputNombre").value = "";
    document.getElementById("asientoSeleccionado").value = asiento;
    modal.show();
}


document.getElementById("btnConfirmarReserva").onclick = () => {
    const nombre = document.getElementById("inputNombre").value.trim();
    const asiento = parseInt(document.getElementById("asientoSeleccionado").value);
    const salaId = parseInt(selectSala.value);
    const sala = Cine.salas.find(s => s.id === salaId);

    if (nombre === "") {
        alert("Debe ingresar un nombre.");
        return;
    }

    sala.reservarAsiento(asiento, nombre);
    modal.hide();
    mostrarAsientos();
    mostrarListaSocios();
};


function mostrarListaSocios() {
    listaSocios.innerHTML = "";

    const salaId = parseInt(selectSala.value);
    const sala = Cine.salas.find(s => s.id === salaId);

    const reservas = Object.entries(sala.asientosReservados);

    if (reservas.length === 0) {
        listaSocios.innerHTML = `<li class="list-group-item">No hay reservas en esta sala.</li>`;
        return;
    }

    reservas.forEach(([asiento, nombre]) => {
        const li = document.createElement("li");
        li.className = "list-group-item d-flex justify-content-between align-items-center";

        li.innerHTML = `
            <div>
                <strong>${nombre}</strong>
                <span class="text-muted">| Asiento ${asiento}</span>
            </div>
        `;

       
        const btn = document.createElement("button");
        btn.className = "btn btn-danger btn-sm";
        btn.innerText = "Anular";

        btn.onclick = () => {
            if (confirm(`¿Seguro que deseas anular la reserva de ${nombre} (asiento ${asiento})?`)) {
                sala.cancelarReserva(parseInt(asiento));
                mostrarAsientos();
                mostrarListaSocios();
            }
        };

        li.appendChild(btn);
        listaSocios.appendChild(li);
    });
}


selectSala.addEventListener("change", () => {
    mostrarAsientos();
    mostrarListaSocios();
});


mostrarAsientos();
mostrarListaSocios();
</script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
